<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="page">
            <head>
                <nav class="navbar">
                    <div class="navbar__line"></div>
                    <a href="../eighthomework/eighthomework.html" class="arrow left__arrow">🡸</a>
                    <div class="navbar__pic">
                        <img src="./images/glaipnir.jpg" alt="Logotype_glaipnir" class="navbar__img">
                    </div>
                    <h1 class="navbar__header">Nineth__HomeWork</h1>
                    <a href="#progr" class="navbar__link">First task</a>
                    <a href="#heart" class="navbar__link">Second task</a>
                    <a href="#school" class="navbar__link">Third task</a>
                    <a href="#add" class="navbar__link">Fourth task</a>
                    <a href="../index.html" class="arrow right__arrow">🡺</a>
                </nav>
            </head>
            <div class="progr">
                <div class="anchor" id="progr"></div>
                <div class="cubic"></div>
            </div>
            <div class="heart">
                <div class="anchor" id="heart"></div>
            </div>
            <div class="school">
                <div class="anchor" id="school"></div>
                <p class="school__text">HELLO, MY SITE!</p>
                <div class="school__wrapper">
                    <div class="school__pic p1">
                        <img class="school__img" src="./images/calcutor.png" alt="img">
                    </div>
                    <div class="school__pic p2">
                        <img class="school__img" src="./images/diploma.png" alt="img">
                    </div>
                    <div class="school__pic p3">
                        <img class="school__img" src="./images/pencil.png" alt="img">
                    </div>
                    <div class="school__pic p4">
                        <img class="school__img" src="./images/desk.png" alt="img">
                    </div>
                    <div class="school__pic p5">
                        <img class="school__img" src="./images/palette.png" alt="img">
                    </div>
                </div>
            </div>
            <div class="add">
                <div class="anchor" id="add"></div>
                <div class="add__bcg">
                    <div class="add__pic">
                        <img class="add__img" src="./images/coffee.png" alt="img">
                    </div>
                </div>
                <div class="add__bcg b2">
                    <div class="add__pic">
                        <img class="add__img" src="./images/fire.png" alt="img">
                    </div>
                </div>
                <div class="add__bcg b3">
                    <div class="add__pic">
                        <img class="add__img" src="./images/book.png" alt="img">
                    </div>
                </div>
            </div>
            <div class="wrapper__animation">
                <div class="block"></div>
                <div class="shadow"></div>
            </div>
            <div class="wrapper__change">
                <div class="bcg">
                    <div class="white"></div>
                    <div class="black"></div>
                </div>
                <div class="bar">
                    <div class="dot">
                        <img src="" alt="">
                    </div>
                </div>
            </div>
            <div class="wrapper__hover">
                <div class="wrp__block">
                    <div class="wrp__text">L e t ` s H o v e r I t</div>
                    <div class="wrp__bcg"></div>
                </div>
            </div>
        </div>
    </body>
</html>
